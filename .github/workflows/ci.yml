name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install exporter tooling
        run: npm install

      - name: Compile (native forge)
        run: forge build

      - name: Typecheck exporter
        run: npm run typecheck

      - name: Tests (Foundry)
        run: forge test

      - name: Export deployable artifacts
        run: npm run deployables:export
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Validate deployables
        run: npm run deployables:validate

      - name: Deployables tests (integrity + determinism)
        run: npm run deployables:test
        env:
          GIT_SHA: ${{ github.sha }}
