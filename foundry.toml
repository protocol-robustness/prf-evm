[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.33"
optimizer = false
via-ir = true
fs_permissions = [
    { access = "read", path = "src/fixtures" },
    { access = "read", path = "test/fixtures" }
]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
    "@sp1-contracts/=lib/sp1-contracts/contracts/src/"
]
